<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JTV Multiservice | Imprenta y servicios gráficos en Santo Domingo</title>
    <meta
      name="description"
      content="Imprenta en la Zona Colonial, Santo Domingo: tarjetas, stickers, banners, sellos, camisetas y más. Calidad, entrega rápida y cotización gratis."
    />
    <meta name="author" content="JTV Multiservice" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Vista previa al compartir (WhatsApp, Facebook, X). Los rastreadores sociales no ejecutan
         JavaScript, así que estas etiquetas deben estar aquí. og:url y canonical los fija cada
         página desde el componente Seo. Si cambia el dominio, actualizar también og:image y el JSON-LD. -->
    <meta
      property="og:title"
      content="JTV Multiservice | Imprenta y servicios gráficos en Santo Domingo"
    />
    <meta
      property="og:description"
      content="Imprenta en la Zona Colonial, Santo Domingo: tarjetas, stickers, banners, sellos, camisetas y más. Calidad, entrega rápida y cotización gratis."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JTV Multiservice" />
    <meta property="og:locale" content="es_DO" />
    <meta property="og:image" content="https://jtvmultiservice.com/og-image.jpg" />
    <meta property="og:image:width" content="973" />
    <meta property="og:image:height" content="750" />
    <meta property="og:image:alt" content="Logotipo de JTV Multiservice" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="JTV Multiservice | Imprenta y servicios gráficos en Santo Domingo"
    />
    <meta
      name="twitter:description"
      content="Imprenta en la Zona Colonial, Santo Domingo: tarjetas, stickers, banners, sellos, camisetas y más. Calidad, entrega rápida y cotización gratis."
    />
    <meta name="twitter:image" content="https://jtvmultiservice.com/og-image.jpg" />

    <!-- Datos estructurados: negocio local (datos tomados de la página de contacto) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "JTV Multiservice",
        "description": "Imprenta y soluciones gráficas: tarjetas, stickers, sellos, banners, material promocional y diseño publicitario.",
        "url": "https://jtvmultiservice.com",
        "image": "https://jtvmultiservice.com/og-image.jpg",
        "telephone": "+1-809-689-4995",
        "email": "jtvmultiservice@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Calle Isabel la Católica esquina Gabino Puello, Plaza Dalbert",
          "addressLocality": "Santo Domingo",
          "addressRegion": "Distrito Nacional",
          "addressCountry": "DO"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "18:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "13:00"
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
